name: Terraform

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize main configuration
        run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly

      - name: Validate main configuration
        run: terraform -chdir=infra validate

      - name: Initialize state backend bootstrap
        run: terraform -chdir=infra/state-backend init -backend=false -input=false -lockfile=readonly

      - name: Validate state backend bootstrap
        run: terraform -chdir=infra/state-backend validate

  plan:
    name: Plan infrastructure
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_DEPLOY_ROLE_ARN: ${{ vars.TF_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_VAR_aws_region: ${{ vars.TF_AWS_REGION }}
      TF_VAR_existing_github_oidc_provider_arn: ${{ vars.TF_GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_github_owner: ${{ vars.TF_GITHUB_OWNER }}
      TF_VAR_github_repository: ${{ vars.TF_GITHUB_REPOSITORY }}
      TF_VAR_vpc_id: ${{ vars.TF_VPC_ID }}
      TF_VAR_subnet_id: ${{ vars.TF_SUBNET_ID }}
      TF_VAR_runner_version: ${{ vars.TF_RUNNER_VERSION }}
      TF_VAR_object_bucket_name: ${{ vars.TF_OBJECT_BUCKET_NAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0

      - name: Check required deployment variables
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_DEPLOY_ROLE_ARN:?Set TF_DEPLOY_ROLE_ARN}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET}"
          : "${TF_STATE_LOCK_TABLE:?Set TF_STATE_LOCK_TABLE}"
          : "${TF_VAR_aws_region:?Set TF_AWS_REGION}"
          : "${TF_VAR_existing_github_oidc_provider_arn:?Set TF_GITHUB_OIDC_PROVIDER_ARN}"
          : "${TF_VAR_github_owner:?Set TF_GITHUB_OWNER}"
          : "${TF_VAR_github_repository:?Set TF_GITHUB_REPOSITORY}"
          : "${TF_VAR_vpc_id:?Set TF_VPC_ID}"
          : "${TF_VAR_subnet_id:?Set TF_SUBNET_ID}"
          : "${TF_VAR_runner_version:?Set TF_RUNNER_VERSION}"
          : "${TF_VAR_object_bucket_name:?Set TF_OBJECT_BUCKET_NAME}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_DEPLOY_ROLE_ARN }}
          role-session-name: terraform-plan-${{ github.run_id }}
          aws-region: ${{ vars.TF_AWS_REGION }}

      - name: Initialize remote backend
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${TF_STATE_LOCK_TABLE:?Set the TF_STATE_LOCK_TABLE repository variable}"
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aws-ec2-instance-agent/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Create Terraform plan
        run: terraform -chdir=infra plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infra/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply infrastructure
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_DEPLOY_ROLE_ARN: ${{ vars.TF_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE }}
      TF_VAR_aws_region: ${{ vars.TF_AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0

      - name: Check required deployment variables
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_DEPLOY_ROLE_ARN:?Set TF_DEPLOY_ROLE_ARN}"
          : "${TF_STATE_BUCKET:?Set TF_STATE_BUCKET}"
          : "${TF_STATE_LOCK_TABLE:?Set TF_STATE_LOCK_TABLE}"
          : "${TF_VAR_aws_region:?Set TF_AWS_REGION}"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_DEPLOY_ROLE_ARN }}
          role-session-name: terraform-apply-${{ github.run_id }}
          aws-region: ${{ vars.TF_AWS_REGION }}

      - name: Initialize remote backend
        shell: bash
        run: |
          set -euo pipefail
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          : "${TF_STATE_LOCK_TABLE:?Set the TF_STATE_LOCK_TABLE repository variable}"
          terraform -chdir=infra init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=aws-ec2-instance-agent/terraform.tfstate" \
            -backend-config="region=${TF_VAR_aws_region}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: infra

      - name: Apply reviewed Terraform plan
        run: terraform -chdir=infra apply -input=false tfplan
