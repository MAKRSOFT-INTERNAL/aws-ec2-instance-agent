name: Terraform EKS

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        type: choice
        required: true
        default: apply
        options:
          - apply
          - destroy
      confirm_destroy:
        description: Type the cluster name to confirm full-stack destruction
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: terraform-eks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Check formatting
        run: terraform fmt -check -recursive terraform modules
      - name: Validate bootstrap
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - name: Validate EKS configuration
        working-directory: terraform/eks
        run: |
          terraform init -backend=false -input=false
          terraform validate

  plan:
    name: Plan EKS deployment
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_OPERATION: ${{ inputs.operation || 'apply' }}
      TF_DESTROY_CONFIRMATION: ${{ inputs.confirm_destroy || '' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'makrosft-tfstate-s3' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'makrsoft-eks' }}
      TF_VAR_kubernetes_version: ${{ vars.EKS_KUBERNETES_VERSION || '1.35' }}
      TF_VAR_vpc_cidr: ${{ vars.EKS_VPC_CIDR || '10.42.0.0/16' }}
      TF_VAR_availability_zone_count: ${{ vars.EKS_AVAILABILITY_ZONE_COUNT || '3' }}
      TF_VAR_node_instance_types: ${{ vars.EKS_NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_node_min_size: ${{ vars.EKS_NODE_MIN_SIZE || '2' }}
      TF_VAR_node_desired_size: ${{ vars.EKS_NODE_DESIRED_SIZE || '2' }}
      TF_VAR_node_max_size: ${{ vars.EKS_NODE_MAX_SIZE || '3' }}
      TF_VAR_cluster_endpoint_public_access: ${{ vars.EKS_CLUSTER_ENDPOINT_PUBLIC_ACCESS || 'false' }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_CLUSTER_ENDPOINT_PUBLIC_ACCESS_CIDRS || '[]' }}
      TF_VAR_cluster_admin_iam_role_arn: ${{ vars.EKS_CLUSTER_ADMIN_IAM_ROLE_ARN || '' }}
      TF_VAR_cluster_view_iam_principal_arn: ${{ vars.EKS_CLUSTER_VIEW_IAM_PRINCIPAL_ARN || 'arn:aws:iam::783161622588:user/makrsoft-admin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESSKEYID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESSKEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$TF_STATE_BUCKET"
          if [[ "$TF_OPERATION" != "apply" && "$TF_OPERATION" != "destroy" ]]; then
            echo "::error::Unsupported Terraform operation: $TF_OPERATION"
            exit 1
          fi
          if [[ "$TF_OPERATION" == "destroy" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::Destroy is only available through manual workflow dispatch."
              exit 1
            fi
            if [[ "$TF_DESTROY_CONFIRMATION" != "$TF_VAR_cluster_name" ]]; then
              echo "::error::To confirm destroy, enter the exact cluster name: $TF_VAR_cluster_name"
              exit 1
            fi
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESSKEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Ensure Terraform state bucket
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi
          aws s3api put-public-access-block \
            --bucket "$TF_STATE_BUCKET" \
            --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning \
            --bucket "$TF_STATE_BUCKET" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$TF_STATE_BUCKET" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
      - name: Initialize Terraform
        working-directory: terraform/eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Import existing EKS access entry if needed
        working-directory: terraform/eks
        env:
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'makrsoft-eks' }}
          PRINCIPAL_ARN: ${{ vars.EKS_CLUSTER_VIEW_IAM_PRINCIPAL_ARN || 'arn:aws:iam::783161622588:user/makrsoft-admin' }}
        run: |
          set -euo pipefail
          resource_address="module.eks.aws_eks_access_entry.cluster_view"
          if terraform state list | grep -Fqx "$resource_address"; then
            echo "EKS access entry is already managed in Terraform state."
            exit 0
          fi

          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws eks describe-access-entry \
            --cluster-name "$CLUSTER_NAME" \
            --principal-arn "$PRINCIPAL_ARN" >/dev/null 2>"$error_file"; then
            terraform import -input=false \
              "$resource_address" \
              "$CLUSTER_NAME:$PRINCIPAL_ARN"
          elif grep -q "ResourceNotFoundException" "$error_file"; then
            echo "No existing access entry found; Terraform will create it."
          else
            cat "$error_file" >&2
            exit 1
          fi
      - name: Create and display saved plan
        working-directory: terraform/eks
        run: |
          if [[ "$TF_OPERATION" == "destroy" ]]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi
          terraform show -no-color tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: eks-terraform-plan
          path: terraform/eks/tfplan
          retention-days: 1

  apply:
    name: Auto-apply saved EKS plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TF_OPERATION: ${{ inputs.operation || 'apply' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'makrosft-tfstate-s3' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      TF_VAR_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'makrsoft-eks' }}
      TF_VAR_kubernetes_version: ${{ vars.EKS_KUBERNETES_VERSION || '1.35' }}
      TF_VAR_vpc_cidr: ${{ vars.EKS_VPC_CIDR || '10.42.0.0/16' }}
      TF_VAR_availability_zone_count: ${{ vars.EKS_AVAILABILITY_ZONE_COUNT || '3' }}
      TF_VAR_node_instance_types: ${{ vars.EKS_NODE_INSTANCE_TYPES || '["t3.micro"]' }}
      TF_VAR_node_min_size: ${{ vars.EKS_NODE_MIN_SIZE || '2' }}
      TF_VAR_node_desired_size: ${{ vars.EKS_NODE_DESIRED_SIZE || '2' }}
      TF_VAR_node_max_size: ${{ vars.EKS_NODE_MAX_SIZE || '3' }}
      TF_VAR_cluster_endpoint_public_access: ${{ vars.EKS_CLUSTER_ENDPOINT_PUBLIC_ACCESS || 'false' }}
      TF_VAR_cluster_endpoint_public_access_cidrs: ${{ vars.EKS_CLUSTER_ENDPOINT_PUBLIC_ACCESS_CIDRS || '[]' }}
      TF_VAR_cluster_admin_iam_role_arn: ${{ vars.EKS_CLUSTER_ADMIN_IAM_ROLE_ARN || '' }}
      TF_VAR_cluster_view_iam_principal_arn: ${{ vars.EKS_CLUSTER_VIEW_IAM_PRINCIPAL_ARN || 'arn:aws:iam::783161622588:user/makrsoft-admin' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Validate deployment configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESSKEYID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESSKEY }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$TF_STATE_BUCKET"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESSKEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - uses: actions/download-artifact@v4
        with:
          name: eks-terraform-plan
          path: terraform/eks
      - name: Initialize Terraform
        working-directory: terraform/eks
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Apply saved plan
        working-directory: terraform/eks
        run: terraform apply -input=false tfplan
